<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d72">
<title>בונה תל״א – תח״י</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#22302e; --ink2:#5b6b68; --line:#e3e1db;
  --brand:#2f7d72; --brand-dark:#25655c; --brand-soft:#e8f2f0; --shadow:0 2px 14px rgba(34,48,46,.07);
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Segoe UI","Arial Hebrew",Arial,system-ui,sans-serif;
  font-size:17px; line-height:1.55; -webkit-text-size-adjust:100%;
}
#app{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1,h2,h3{margin:0 0 8px;line-height:1.3}
h1{font-size:26px}
h2{font-size:22px}
h3{font-size:19px}
p{margin:0 0 12px}

/* --- כפתורים כלליים --- */
.btn{
  display:block; width:100%; min-height:52px; margin-top:12px; padding:14px 18px;
  border:1.5px solid var(--line); border-radius:14px; background:#fff; color:var(--ink);
  font:inherit; font-weight:600; cursor:pointer; transition:background .15s,border-color .15s,transform .1s;
}
.btn:hover{border-color:var(--brand)}
.btn:active{transform:scale(.99)}
.btn.primary{background:var(--brand); border-color:var(--brand); color:#fff}
.btn.primary:hover{background:var(--brand-dark)}
.btn.primary:disabled{background:#c9d3d1;border-color:#c9d3d1;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2);font-weight:500}
.btn.big{min-height:60px;font-size:19px}
button:focus-visible,[contenteditable]:focus-visible,textarea:focus-visible{
  outline:3px solid var(--brand); outline-offset:2px;
}

/* --- מסך פתיחה --- */
.home{text-align:center;padding:48px 8px 0}
.logo{
  display:inline-block;background:var(--brand);color:#fff;font-size:30px;font-weight:700;
  padding:14px 22px;border-radius:20px;margin-bottom:20px;letter-spacing:1px;
}
.lead{color:var(--ink2);font-size:18px;margin-bottom:28px}
.privacy{margin-top:28px;color:var(--ink2);font-size:15px}
.credit{margin-top:22px;text-align:center;color:var(--ink2);font-size:14px;opacity:.85}

/* --- כותרת שאלה והתקדמות --- */
.progress{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 14px}
.progress .fill{height:100%;background:var(--brand);border-radius:3px;transition:width .25s ease}
.qhead,.rhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.rhead{align-items:flex-start}
.back{background:none;border:none;color:var(--ink2);font:inherit;font-size:16px;cursor:pointer;padding:8px 4px}
.back:hover{color:var(--brand)}
.count{color:var(--ink2);font-size:15px}

/* --- כרטיס שאלה --- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 20px}
.card.wide{padding:22px 18px}
.card .sub{color:var(--ink2);font-size:16px}
.card .sub2{color:var(--ink2);font-size:16px;font-weight:600;margin:18px 0 8px}
.tag{display:inline-block;background:var(--brand-soft);color:var(--brand-dark);font-size:14px;
  font-weight:600;padding:4px 12px;border-radius:20px;margin-bottom:10px}
.enter{animation:slide .18s ease}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.enter{animation:none}.progress .fill{transition:none}}

/* --- אפשרויות --- */
.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.opts.stack{flex-direction:column}
.opts.grid{display:grid;grid-template-columns:repeat(4,1fr)}
.opt{
  flex:1 1 auto; min-height:52px; display:flex; flex-direction:column; justify-content:center;
  gap:2px; padding:12px 16px; border:1.5px solid var(--line); border-radius:14px; background:#fff;
  color:var(--ink); font:inherit; text-align:right; cursor:pointer; position:relative;
  transition:background .15s,border-color .15s;
}
.opts.grid .opt{align-items:center;text-align:center;flex:none}
.opt:hover{border-color:var(--brand);background:#fbfdfd}
.opt.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;padding-left:44px}
.opts.grid .opt.on{padding-left:16px}
.opt.on::after{content:"✓";position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:19px}
.opts.grid .opt.on::after{content:none}
.opt .hint{font-size:13px;opacity:.7;font-weight:600}
.opt .desc{font-size:14px;color:var(--ink2)}
.opt.on .desc{color:rgba(255,255,255,.85)}
.counter{margin-top:14px;color:var(--ink2);font-size:15px;text-align:center}

/* --- כרטיסי תחום --- */
.domaincards{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.dcard{
  display:flex;align-items:center;gap:14px;padding:18px 16px;min-height:76px;
  border:1.5px solid var(--line);border-radius:var(--r);background:#fff;font:inherit;
  text-align:right;cursor:pointer;position:relative;transition:background .15s,border-color .15s;
}
.dcard .ico{font-size:28px;line-height:1}
.dcard .txt{display:flex;flex-direction:column}
.dcard .lbl{font-size:18px;font-weight:700}
.dcard .desc{font-size:14px;color:var(--ink2)}
.dcard:hover{border-color:var(--brand)}
.dcard.on{background:var(--brand);border-color:var(--brand);color:#fff}
.dcard.on .desc{color:rgba(255,255,255,.85)}
.dcard.on::after{content:"✓";position:absolute;left:18px;font-size:22px}
.dcard.dim{opacity:.45}

/* --- טקסט חופשי --- */
textarea{
  width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;
  font:inherit;font-size:16px;color:var(--ink);background:#fff;resize:vertical;
}
textarea.big{min-height:150px;margin-top:14px}
textarea.note{min-height:86px;margin-top:10px}
.notewrap{margin-top:14px}
.link{background:none;border:none;color:var(--brand-dark);font:inherit;font-size:16px;
  font-weight:600;cursor:pointer;padding:6px 0}

/* --- מסך פתיחה: רמז למסלול --- */
.modehint{margin:6px 0 18px;color:var(--ink2);font-size:14px}

/* --- רמזור --- */
.tlcol{border:1.5px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden}
.tlhead{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:12px 16px;
  background:#fdfdfc;border:none;font:inherit;font-weight:700;cursor:pointer;text-align:right;color:var(--ink)}
.tlhead:hover{background:var(--brand-soft)}
.tlhead.on{background:var(--brand-soft);color:var(--brand-dark)}
.tlname{flex:1}
.tlcount{font-weight:600;font-size:14px;color:var(--ink2);background:#fff;
  border:1px solid var(--line);border-radius:20px;padding:2px 10px}
.tlarrow{color:var(--ink2);font-size:14px}
.tlrows{border-top:1.5px solid var(--line)}
.tlsection{padding:10px 16px;background:#f4f8f7;color:var(--brand-dark);font-weight:700;
  font-size:14px;letter-spacing:.02em;border-bottom:1px solid var(--line)}
.tlkey{display:flex;flex-direction:column;gap:8px;margin:14px 0 4px;padding:12px 14px;
  background:#fbfbf9;border:1.5px solid var(--line);border-radius:12px}
.tlkeyitem{display:flex;align-items:flex-start;gap:10px;font-size:15px}
.tlkeydot{font-size:17px;line-height:1.3}
.tlkeytxt{display:flex;flex-direction:column}
.tlkeyhelp{color:var(--ink2);font-size:13.5px}
.notice.soft{background:#f4f8f7;border-color:#c9ddd9}
.tlrow{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.tlrow:last-child{border-bottom:none}
.tllbl{flex:1;font-size:16px;line-height:1.35}
.tlbtns{display:flex;gap:6px;flex-shrink:0}
.tlb{width:46px;height:46px;border:1.5px solid var(--line);border-radius:12px;background:#fff;
  font-size:19px;line-height:1;cursor:pointer;padding:0}
.tlb:hover{border-color:var(--brand)}
.tlb.on{border-width:3px}
.tlb.g.on{border-color:#2f9e5f;background:#eaf7ef}
.tlb.y.on{border-color:#d8a520;background:#fdf6e3}
.tlb.o.on{border-color:#d1701d;background:#fdf0e4}
@media (max-width:520px){
  .tlrow{flex-direction:column;align-items:stretch;gap:8px;padding:12px 14px}
  .tlbtns{justify-content:flex-start}
  .tlb{flex:1;max-width:88px}
}

/* --- סיכום --- */
.pcard{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px;background:#fdfdfc}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ptitle{font-weight:700;color:var(--brand-dark)}
.pencil{background:none;border:1.5px solid var(--line);border-radius:10px;width:40px;height:40px;
  font-size:17px;cursor:pointer;color:var(--ink2)}
.pencil:hover{border-color:var(--brand);color:var(--brand)}
.plist{margin:8px 0 0;padding:0 20px 0 0}
.plist li{margin-bottom:5px}
.pedit{margin-top:10px;min-height:120px}
.identnote{margin:4px 0 10px;color:var(--ink2);font-size:14px}
.identgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.identfield{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink2)}
.identfield input{min-height:46px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;
  font:inherit;font-size:16px;color:var(--ink);background:#fff}
.identfield input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
@media (max-width:520px){.identgrid{grid-template-columns:1fr}}

/* --- טעינה --- */
.loading{text-align:center;padding:90px 20px}
.spin{width:44px;height:44px;margin:0 auto 20px;border:4px solid var(--line);
  border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.lmsg{color:var(--ink2);font-size:17px}

/* --- תוצר --- */
#app:has(.tbox){max-width:1180px}
.tbox{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:18px 16px;margin-bottom:18px}
.thead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.thead h3{flex:1;margin:0}
.dtag{background:var(--brand-soft);color:var(--brand-dark);font-size:13px;font-weight:600;
  padding:4px 10px;border-radius:20px}
.xbtn{background:none;border:1.5px solid var(--line);border-radius:10px;width:36px;height:36px;
  cursor:pointer;color:var(--ink2);font-size:15px}
.xbtn:hover{border-color:#c0392b;color:#c0392b}
table.plan{width:100%;border-collapse:collapse;font-size:15px}
table.plan th{background:var(--brand-soft);color:var(--brand-dark);text-align:right;
  padding:10px;border:1px solid var(--line);font-size:14px}
table.plan td{padding:10px;border:1px solid var(--line);vertical-align:top;white-space:pre-line}
table.plan td:focus{background:#fbfdfd}
.actions{display:flex;flex-direction:column;gap:0;margin-top:20px}
.notice{background:#fff8e6;border:1.5px solid #e8d49a;border-radius:14px;padding:14px 16px;
  margin-bottom:16px;font-size:16px}
.toast{position:fixed;bottom:24px;right:50%;transform:translateX(50%);background:var(--ink);
  color:#fff;padding:12px 20px;border-radius:12px;font-size:16px;z-index:60;transition:opacity .4s}
.toast.out{opacity:0}

/* --- חלונית --- */
.modalback{position:fixed;inset:0;background:rgba(34,48,46,.45);display:flex;align-items:center;
  justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:var(--r);padding:20px;max-width:560px;width:100%;
  max-height:86vh;overflow:auto}
.modal .opt{width:100%;margin-bottom:8px}
.mdom{font-weight:700;color:var(--brand-dark);margin:16px 0 8px}

/* --- מובייל: טבלה לכרטיסים --- */
@media (max-width:760px){
  table.plan thead{display:none}
  table.plan,table.plan tbody,table.plan tr,table.plan td{display:block;width:100%}
  table.plan tr{border:1.5px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
  table.plan td{border:none;border-bottom:1px solid var(--line);padding:12px 14px}
  table.plan td:last-child{border-bottom:none}
  table.plan td::before{
    content:attr(data-label);display:block;font-size:13px;font-weight:700;
    color:var(--brand-dark);margin-bottom:4px;
  }
  .opts.grid{grid-template-columns:repeat(3,1fr)}
  #app{padding:12px 12px 40px}
}
</style>
</head>
